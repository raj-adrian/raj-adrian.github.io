<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tetris Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    <canvas id="tetris" width="240" height="400"></canvas>

    <div class="sidebar">
        <h1>TETRIS</h1>
        <div class="score-box">
            Score: <span id="score">0</span>
        </div>

        <div class="controls">
            <p>⬅ ➡ Move</p>
            <p>⬇ Drop</p>
            <p>⬆ Rotate</p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
