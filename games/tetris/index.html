<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tetris Portfolio Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tetris-wrapper">

    <div class="game-card">

        <div class="header">
            <h1>TETRIS</h1>
            <span class="badge">Portfolio Edition</span>
        </div>

        <div class="game-layout">

            <canvas id="board" width="300" height="600"></canvas>

            <div class="sidebar">

                <div class="panel">
                    <h3>Score</h3>
                    <div id="score">0</div>
                </div>

                <div class="panel">
                    <h3>High Score</h3>
                    <div id="highScore">0</div>
                </div>

                <div class="panel">
                    <h3>Level</h3>
                    <div id="level">1</div>
                </div>

                <div class="panel">
                    <h3>Next</h3>
                    <canvas id="next" width="120" height="120"></canvas>
                </div>

                <div class="panel">
                    <h3>Hold</h3>
                    <canvas id="hold" width="120" height="120"></canvas>
                </div>

                <button id="startBtn">Start Game</button>
                <button id="pauseBtn">Pause</button>

            </div>

        </div>

        <div id="tetrisEffect"></div>

        <div id="overlay" class="overlay">
            <div class="overlay-box">
                <h2>TETRIS</h2>
                <p>Press Start to Play</p>
            </div>
        </div>
        
    </div>

</div>

<audio id="clearSound">
    <source src="clear.mp3" type="audio/mpeg">
</audio>

<audio id="dropSound">
    <source src="drop.mp3" type="audio/mpeg">
</audio>
    
<script src="script.js"></script>
</body>
</html>
